<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BhaxaKhel Share Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 16px;
    background: #faf9f6;
    color: #202020;
    font-family: "Manrope", sans-serif;
  }

  .wrap {
    width: min(100%, 420px);
    margin: 0 auto;
  }

  .card {
    background: #fffdf9;
    border: 1px solid #ece7df;
    border-radius: 20px;
    padding: 30px 24px 26px;
    text-align: center;
  }

  .title {
    font-family: "Noto Sans Bengali", sans-serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    margin: 0;
  }

  .sub {
    margin-top: 7px;
    font-size: 12px;
    color: #8b877f;
  }

  .date {
    margin-top: 24px;
    font-size: 13px;
    color: #8b877f;
  }

  .score {
    margin-top: 18px;
    font-size: 32px;
    font-weight: 700;
  }

  .grid {
    margin: 22px auto 0;
    width: 244px;
    display: grid;
    grid-template-columns: repeat(5, 42px);
    gap: 8px;
    justify-content: center;
  }

  .sq {
    width: 42px;
    height: 42px;
    border-radius: 8px;
  }

  .green { background: #4f8c65; }
  .yellow { background: #c39a3b; }
  .gray { background: #aaa49c; }

  .name {
    margin-top: 22px;
    font-size: 15px;
    font-weight: 600;
  }

  .url {
    margin-top: 7px;
    font-size: 12px;
    color: #8b877f;
  }

  .controls {
    margin-top: 18px;
    display: grid;
    gap: 10px;
  }

  input {
    width: 100%;
    height: 44px;
    border: 1px solid #d9d3ca;
    border-radius: 10px;
    background: #fff;
    padding: 0 12px;
    font: inherit;
  }

  button {
    width: 100%;
    height: 46px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .primary {
    background: #d96f32;
    color: white;
  }

  .secondary {
    background: white;
    color: #333;
    border: 1px solid #d9d3ca;
  }

  .note {
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: #7b776f;
  }

  canvas {
    display: none;
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="shareCard" class="card">
    <h1 class="title">ভাষাখেল</h1>
    <div class="sub">Inspired by Wordle</div>

    <div id="dateText" class="date">29 Aug 2026</div>

    <div id="scoreText" class="score">3 / 5</div>

    <div id="resultGrid" class="grid">
      <div class="sq gray"></div>
      <div class="sq yellow"></div>
      <div class="sq gray"></div>
      <div class="sq green"></div>
      <div class="sq gray"></div>

      <div class="sq green"></div>
      <div class="sq gray"></div>
      <div class="sq yellow"></div>
      <div class="sq green"></div>
      <div class="sq gray"></div>

      <div class="sq green"></div>
      <div class="sq green"></div>
      <div class="sq green"></div>
      <div class="sq green"></div>
      <div class="sq green"></div>
    </div>

    <div id="cardName" class="name hidden-name"></div>
    <div class="url">bhaxakhel.github.io</div>
  </div>

  <div class="controls">
    <input id="nameInput" type="text" maxlength="40" placeholder="Your name (optional)">
    <button id="sharePNG" class="primary" type="button">Share Result Image</button>
    <button id="savePNG" class="secondary" type="button">Save PNG</button>
  </div>

  <div id="note" class="note"></div>

</div>

<canvas id="canvas" width="1080" height="1350"></canvas>

<script>
  const COLORS = {
    bg: "#faf9f6",
    card: "#fffdf9",
    text: "#202020",
    muted: "#8b877f",
    green: "#4f8c65",
    yellow: "#c39a3b",
    gray: "#aaa49c",
    orange: "#d96f32"
  };

  const result = [
    ["gray","yellow","gray","green","gray"],
    ["green","gray","yellow","green","gray"],
    ["green","green","green","green","green"]
  ];

  const score = "3 / 5";
  const date = "29 Aug 2026";

  const nameInput = document.getElementById("nameInput");
  const cardName = document.getElementById("cardName");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const note = document.getElementById("note");

  nameInput.addEventListener("input", () => {
    cardName.textContent = nameInput.value.trim();
  });

  async function makePNGBlob() {
    await document.fonts.ready;

    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    const x = 90;
    const y = 70;
    const w = 900;
    const h = 1210;
    const r = 38;

    roundRect(ctx, x, y, w, h, r);
    ctx.fillStyle = COLORS.card;
    ctx.fill();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = COLORS.text;
    ctx.font = '700 86px "Noto Sans Bengali"';
    ctx.fillText("ভাষাখেল", W / 2, 190);

    ctx.fillStyle = COLORS.muted;
    ctx.font = '500 30px "Manrope"';
    ctx.fillText("Inspired by Wordle", W / 2, 265);

    ctx.font = '500 31px "Manrope"';
    ctx.fillText(date, W / 2, 355);

    ctx.fillStyle = COLORS.text;
    ctx.font = '700 76px "Manrope"';
    ctx.fillText(score, W / 2, 475);

    const tile = 112;
    const gap = 18;
    const gridWidth = tile * 5 + gap * 4;
    const startX = (W - gridWidth) / 2;
    const startY = 580;

    result.forEach((row, rIndex) => {
      row.forEach((status, cIndex) => {
        const tx = startX + cIndex * (tile + gap);
        const ty = startY + rIndex * (tile + gap);

        roundRect(ctx, tx, ty, tile, tile, 18);
        ctx.fillStyle = COLORS[status];
        ctx.fill();
      });
    });

    const name = nameInput.value.trim();
    if (name) {
      ctx.fillStyle = COLORS.text;
      ctx.font = '600 38px "Manrope"';
      ctx.fillText(name, W / 2, 1040);
    }

    ctx.fillStyle = COLORS.muted;
    ctx.font = '500 30px "Manrope"';
    ctx.fillText("bhaxakhel.github.io", W / 2, 1130);

    return new Promise(resolve => {
      canvas.toBlob(resolve, "image/png", 1);
    });
  }

  async function sharePNG() {
    note.textContent = "";

    const blob = await makePNGBlob();
    if (!blob) {
      note.textContent = "Could not create the image.";
      return;
    }

    const file = new File(
      [blob],
      "bhaxakhel-result.png",
      { type: "image/png" }
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      try {
        await navigator.share({
          files: [file]
        });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }

    downloadBlob(blob);
    note.textContent = "Image sharing is unavailable here, so the PNG was saved instead.";
  }

  async function savePNG() {
    const blob = await makePNGBlob();

    if (!blob) {
      note.textContent = "Could not create the image.";
      return;
    }

    downloadBlob(blob);
    note.textContent = "PNG saved.";
  }

  function downloadBlob(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "bhaxakhel-result.png";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);

    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  document.getElementById("sharePNG").addEventListener("click", sharePNG);
  document.getElementById("savePNG").addEventListener("click", savePNG);
</script>

</body>
</html>
