<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xobdle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #ffffff;
      color: #202020;
      font-family: "Poppins", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .viewport-stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 4px 0;
    }

    .page {
      position: relative;
      width: 460px;
      flex: 0 0 460px;
      margin: 0;
      padding: 22px 12px 30px;
      transform-origin: top center;
      will-change: transform;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      margin: 0;
      font-family: "Poppins", sans-serif;
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .xobdle-logo span {
      font: inherit;
      font-size: 1em;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      color: #d96f32;
      margin-left: 0;
      vertical-align: baseline;
    }

    .game-date {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #8b877f;
    }

    .hint-box {
      width: 100%;
      max-width: 300px;
      margin: 12px auto 16px;
      text-align: center;
    }

    .hint-label {
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 12px;
      color: #8b877f;
      margin-bottom: 5px;
    }

    .hint-vowels {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 21px;
      font-weight: 600;
    }

    .message {
      min-height: 21px;
      margin-bottom: 7px;
      text-align: center;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 13px;
      color: #6e6962;
    }

    .board {
      width: 100%;
      max-width: 330px;
      margin: 0 auto 22px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .tile {
      aspect-ratio: 1;
      border: 1.8px solid #d8d4cd;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffdfa;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 27px;
      font-weight: 600;
    }

    .tile.filled {
      border-color: #aaa39a;
    }

    .tile.correct {
      background: #4f8c65;
      border-color: #4f8c65;
      color: white;
    }

    .tile.present {
      background: #c39a3b;
      border-color: #c39a3b;
      color: white;
    }

    .tile.absent {
      background: #99948d;
      border-color: #99948d;
      color: white;
    }

    .keyboard {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 30px;
      user-select: none;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .key-row.indent-1 {
      padding-left: 16px;
      padding-right: 4px;
    }

    .key-row.indent-2 {
      padding-left: 9px;
      padding-right: 9px;
    }

    .key {
      min-width: 0;
      flex: 1 1 0;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: #e8e4dd;
      color: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 4px;
    }

    .key.action {
      flex: 1.35 1 0;
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      background: #d96f32;
      color: white;
    }

    .key.correct {
      background: #4f8c65;
      color: white;
    }

    .key.present {
      background: #c39a3b;
      color: white;
    }

    .key.absent {
      background: #c8c3bc;
      color: #777;
    }

    .visitor-count {
      margin: -14px auto 0;
      text-align: center;
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #aaa49c;
      letter-spacing: 0.1px;
    }

    .visitor-count strong {
      color: #7f7a73;
      font-weight: 600;
    }


    .help-button {
      position: absolute;
      top: 19px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: 1px solid #dedad4;
      border-radius: 50%;
      background: #ffffff;
      color: #77726b;
      font-family: "Poppins", sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .instructions-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255, 255, 255, 0.92);
    }

    .instructions-overlay.hidden {
      display: none;
    }

    .instructions-card {
      position: relative;
      width: min(380px, 92vw);
      background: #ffffff;
      border: 1px solid #e6e1da;
      border-radius: 18px;
      padding: 28px 24px 24px;
      text-align: left;
    }

    .instructions-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f2efea;
      color: #55514c;
      font-family: "Poppins", sans-serif;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .instructions-card h2 {
      margin: 0 42px 18px 0;
      font-family: "Poppins", sans-serif;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .instructions-list {
      margin: 0;
      padding-left: 20px;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #45413c;
    }

    .instructions-list li + li {
      margin-top: 8px;
    }

    .legend {
      margin-top: 18px;
      display: grid;
      gap: 9px;
      font-family: "Noto Sans Bengali", sans-serif;
      font-size: 13px;
      color: #65605a;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .legend-box {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: 5px;
    }

    .legend-box.correct { background: #4f8c65; }
    .legend-box.present { background: #c39a3b; }
    .legend-box.absent  { background: #aaa49c; }

    .result-page {
      text-align: center;
    }

    .result-card {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: #fffdf9;
      border: 1px solid #ece7df;
      border-radius: 20px;
      padding: 28px 22px 25px;
    }

    .result-title {
      margin: 0;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .result-date {
      margin-top: 17px;
      font-size: 12px;
      color: #8b877f;
    }

    .result-grid {
      width: 244px;
      margin: 23px auto 0;
      display: grid;
      grid-template-columns: repeat(5, 42px);
      gap: 8px;
      justify-content: center;
    }

    .result-square {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      border: 1.5px solid transparent;
    }

    .result-square.correct {
      background: #4f8c65;
    }

    .result-square.present {
      background: #c39a3b;
    }

    .result-square.absent {
      background: #aaa49c;
    }

    .result-square.empty {
      background: transparent;
      border-color: #d4cec5;
    }

    .play-link {
      margin-top: 27px;
      font-size: 18px;
      font-weight: 600;
      color: #202020;
    }

    .play-link strong {
      color: #d96f32;
      font-weight: 700;
    }

    .result-actions {
      width: 100%;
      max-width: 390px;
      margin: 14px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result-actions button {
      height: 46px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .share-button {
      border: 0;
      background: #d96f32;
      color: white;
    }

    .save-button {
      border: 1px solid #d9d3ca;
      background: white;
      color: #333;
    }

    .share-note {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #77726b;
    }

    .back-button {
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: #8b877f;
      font-size: 12px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <div class="viewport-stage">

    <!-- GAME PAGE -->
    <main id="gamePage" class="page">
      <button id="helpBtn" class="help-button" type="button" aria-label="How to play">?</button>

      <header class="brand">
        <h1 class="xobdle-logo">Xobdle<span>.in</span></h1>
      </header>

      <div id="gameDate" class="game-date"></div>

      <div id="message" class="message" aria-live="polite"></div>

      <section id="board" class="board" aria-label="Xobdle board"></section>

      <section id="keyboard" class="keyboard" aria-label="Xobdle keyboard"></section>

      <div class="visitor-count">
        Visitors: <strong id="visitorCount">—</strong>
      </div>
    </main>

    <!-- RESULT PAGE -->
    <main id="resultPage" class="page result-page hidden">
      <section class="result-card">
        <h1 class="result-title xobdle-logo">Xobdle<span>.in</span></h1>

        <div id="resultDate" class="result-date"></div>

        <div id="resultGrid" class="result-grid"></div>

      </section>

      <div class="result-actions">
        <button id="shareBtn" class="share-button" type="button">Share</button>
        <button id="saveBtn" class="save-button" type="button">Save PNG</button>
      </div>

      <div id="shareNote" class="share-note" aria-live="polite"></div>

      <button id="backBtn" class="back-button" type="button">Back</button>
    </main>


    <div id="instructionsOverlay" class="instructions-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="instructionsTitle">
      <div class="instructions-card">
        <button id="instructionsClose" class="instructions-close" type="button" aria-label="Close instructions">×</button>

        <h2 id="instructionsTitle">কেনেকৈ খেলিব</h2>

        <ol class="instructions-list">
          <li>আজিৰ ৫-অক্ষৰীয়া শব্দটো অনুমান কৰক।</li>
          <li>তলৰ অক্ষৰসমূহ টিপি এটা শব্দ সাজক।</li>
          <li>প্ৰতিদিনে সৰ্বাধিক ৫টা চেষ্টা পাব।</li>
        </ol>

        <div class="legend">
          <div class="legend-row">
            <span class="legend-box correct"></span>
            <span>সঠিক অক্ষৰ, সঠিক ঠাইত।</span>
          </div>

          <div class="legend-row">
            <span class="legend-box present"></span>
            <span>অক্ষৰটো শব্দত আছে, কিন্তু ঠাই বেলেগ।</span>
          </div>

          <div class="legend-row">
            <span class="legend-box absent"></span>
            <span>অক্ষৰটো আজিৰ শব্দত নাই।</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="resultCanvas" width="1080" height="1350"></canvas>

  <script>
    /*
      DEMO DAILY PUZZLE
      Replace these values with the daily puzzle later.
    */

    const answer = ["গা", "মো", "চা", "খ", "ন"];

    const keys = [
      "গা","মো","চা","খ","ন","কি","তা","প",
      "মা","নু","হ","জ","ক","ল","বা","গি",
      "ৰি","সা","ট","দে","পা","ৰ","ফু","নী",
      "ডা","শি","ব","তো"
    ];

    const keyboardRows = [
      keys.slice(0, 8),
      keys.slice(8, 16),
      keys.slice(16, 24),
      keys.slice(24, 28)
    ];

    const MAX_GUESSES = 5;
    const WORD_LENGTH = 5;

    let currentGuess = [];
    let guesses = [];
    let evaluations = [];
    let gameOver = false;

    const board = document.getElementById("board");
    const keyboard = document.getElementById("keyboard");
    const message = document.getElementById("message");

    const resultCanvas = document.getElementById("resultCanvas");
    const ctx = resultCanvas.getContext("2d");

    const COLORS = {
      background: "#ffffff",
      card: "#fffdf9",
      text: "#202020",
      muted: "#8b877f",
      green: "#4f8c65",
      yellow: "#c39a3b",
      gray: "#aaa49c",
      emptyBorder: "#d4cec5",
      orange: "#d96f32"
    };


    function updateVisitorCount() {
      const counter = document.getElementById("visitorCount");
      if (!counter) return;

      let count = Number(localStorage.getItem("xobdleVisitorCount") || "0");

      if (!sessionStorage.getItem("xobdleVisitCounted")) {
        count += 1;
        localStorage.setItem("xobdleVisitorCount", String(count));
        sessionStorage.setItem("xobdleVisitCounted", "1");
      }

      counter.textContent = count.toLocaleString("en-IN");
    }


    const instructionsOverlay = document.getElementById("instructionsOverlay");
    const helpBtn = document.getElementById("helpBtn");
    const instructionsClose = document.getElementById("instructionsClose");

    function openInstructions() {
      instructionsOverlay.classList.remove("hidden");
      refitSoon();
    }

    function closeInstructions() {
      instructionsOverlay.classList.add("hidden");
      localStorage.setItem("xobdleInstructionsSeen", "1");
      refitSoon();
    }

    helpBtn.addEventListener("click", openInstructions);
    instructionsClose.addEventListener("click", closeInstructions);

    instructionsOverlay.addEventListener("click", (event) => {
      if (event.target === instructionsOverlay) {
        closeInstructions();
      }
    });

    function formattedDate() {
      return new Intl.DateTimeFormat("en-AU", {
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(new Date());
    }

    function buildBoard() {
      board.innerHTML = "";

      for (let i = 0; i < MAX_GUESSES * WORD_LENGTH; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        board.appendChild(tile);
      }
    }

    function makeKey(label) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "key";
      button.textContent = label;
      button.dataset.key = label;
      button.addEventListener("click", () => handleKey(label));
      return button;
    }

    function makeActionKey(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "key action";
      button.textContent = label;
      button.dataset.action = action;

      button.addEventListener("click", () => {
        if (action === "enter") submitGuess();
        if (action === "backspace") backspace();
      });

      return button;
    }

    function buildKeyboard() {
      keyboard.innerHTML = "";

      keyboardRows.forEach((rowKeys, rowIndex) => {
        const row = document.createElement("div");
        row.className = "key-row";

        if (rowIndex === 1) row.classList.add("indent-1");
        if (rowIndex === 2) row.classList.add("indent-2");

        if (rowIndex < 3) {
          rowKeys.forEach(key => row.appendChild(makeKey(key)));
        } else {
          row.appendChild(makeActionKey("⌫", "backspace"));
          rowKeys.forEach(key => row.appendChild(makeKey(key)));
          row.appendChild(makeActionKey("ENTER", "enter"));
        }

        keyboard.appendChild(row);
      });
    }

    function renderBoard() {
      const tiles = [...board.children];

      for (let row = 0; row < MAX_GUESSES; row++) {
        for (let col = 0; col < WORD_LENGTH; col++) {
          const index = row * WORD_LENGTH + col;
          const tile = tiles[index];

          tile.className = "tile";
          tile.textContent = "";

          if (row < guesses.length) {
            tile.textContent = guesses[row][col];
            tile.classList.add(evaluations[row][col]);
          } else if (row === guesses.length) {
            const value = currentGuess[col];

            if (value) {
              tile.textContent = value;
              tile.classList.add("filled");
            }
          }
        }
      }
    }

    function handleKey(key) {
      if (gameOver) return;
      if (currentGuess.length >= WORD_LENGTH) return;

      currentGuess.push(key);
      message.textContent = "";
      renderBoard();
      refitSoon();
    }

    function backspace() {
      if (gameOver) return;

      currentGuess.pop();
      message.textContent = "";
      renderBoard();
      refitSoon();
    }

    function evaluateGuess(guess, target) {
      const result = Array(WORD_LENGTH).fill("absent");
      const used = Array(WORD_LENGTH).fill(false);

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guess[i] === target[i]) {
          result[i] = "correct";
          used[i] = true;
        }
      }

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (result[i] === "correct") continue;

        for (let j = 0; j < WORD_LENGTH; j++) {
          if (!used[j] && guess[i] === target[j]) {
            result[i] = "present";
            used[j] = true;
            break;
          }
        }
      }

      return result;
    }

    function submitGuess() {
      if (gameOver) return;

      if (currentGuess.length !== WORD_LENGTH) {
        message.textContent = "৫টা অক্ষৰ বাছনি কৰক";
        return;
      }

      const guess = [...currentGuess];
      const evaluation = evaluateGuess(guess, answer);

      guesses.push(guess);
      evaluations.push(evaluation);
      currentGuess = [];

      renderBoard();
      updateKeyboardStatuses();

      const won = evaluation.every(status => status === "correct");

      if (won) {
        gameOver = true;
        message.textContent = "সঠিক!";
        setTimeout(showResult, 450);
        return;
      }

      if (guesses.length >= MAX_GUESSES) {
        gameOver = true;
        message.textContent = "আজিৰ শব্দ শেষ";
        setTimeout(showResult, 450);
      }

      refitSoon();
    }

    function statusRank(status) {
      return {
        absent: 1,
        present: 2,
        correct: 3
      }[status] || 0;
    }

    function updateKeyboardStatuses() {
      const best = {};

      guesses.forEach((guess, rowIndex) => {
        guess.forEach((key, colIndex) => {
          const status = evaluations[rowIndex][colIndex];

          if (!best[key] || statusRank(status) > statusRank(best[key])) {
            best[key] = status;
          }
        });
      });

      keyboard.querySelectorAll(".key[data-key]").forEach(button => {
        button.classList.remove("correct", "present", "absent");

        const status = best[button.dataset.key];

        if (status) {
          button.classList.add(status);
        }
      });
    }

    function resultStatusAt(rowIndex, colIndex) {
      if (rowIndex >= evaluations.length) return "empty";
      return evaluations[rowIndex][colIndex];
    }

    function renderResultGrid() {
      const grid = document.getElementById("resultGrid");
      grid.innerHTML = "";

      for (let row = 0; row < MAX_GUESSES; row++) {
        for (let col = 0; col < WORD_LENGTH; col++) {
          const square = document.createElement("div");
          const status = resultStatusAt(row, col);

          square.className = "result-square " + status;
          grid.appendChild(square);
        }
      }
    }

    function showResult() {
      document.getElementById("gamePage").classList.add("hidden");
      document.getElementById("resultPage").classList.remove("hidden");

      document.getElementById("resultDate").textContent = formattedDate();

      renderResultGrid();

      document.getElementById("shareNote").textContent = "";

      refitSoon();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    async function createResultPNG() {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const W = resultCanvas.width;
      const H = resultCanvas.height;

      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = COLORS.background;
      ctx.fillRect(0, 0, W, H);

      const cardX = 90;
      const cardY = 70;
      const cardW = 900;
      const cardH = 1210;

      roundRect(ctx, cardX, cardY, cardW, cardH, 38);
      ctx.fillStyle = COLORS.card;
      ctx.fill();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Xobdle.in logo: same font, size and baseline; only .in is orange.
      ctx.textAlign = "left";
      ctx.font = '700 92px "Poppins", sans-serif';

      const mainLogoWidth = ctx.measureText("Xobdle").width;
      const suffixWidth = ctx.measureText(".in").width;
      const logoWidth = mainLogoWidth + suffixWidth;
      const logoX = (W - logoWidth) / 2;

      ctx.fillStyle = COLORS.text;
      ctx.fillText("Xobdle", logoX, 205);

      ctx.fillStyle = COLORS.orange;
      ctx.fillText(".in", logoX + mainLogoWidth, 205);

      ctx.textAlign = "center";
      ctx.fillStyle = COLORS.muted;
      ctx.font = '500 32px "Poppins", sans-serif';
      ctx.fillText(formattedDate(), W / 2, 320);

      const tile = 112;
      const gap = 18;
      const gridWidth = tile * 5 + gap * 4;
      const startX = (W - gridWidth) / 2;
      const startY = 420;

      for (let row = 0; row < MAX_GUESSES; row++) {
        for (let col = 0; col < WORD_LENGTH; col++) {
          const status = resultStatusAt(row, col);

          const x = startX + col * (tile + gap);
          const y = startY + row * (tile + gap);

          roundRect(ctx, x, y, tile, tile, 18);

          if (status === "empty") {
            ctx.fillStyle = COLORS.card;
            ctx.fill();

            ctx.lineWidth = 4;
            ctx.strokeStyle = COLORS.emptyBorder;
            ctx.stroke();
          } else {
            const fillMap = {
              correct: COLORS.green,
              present: COLORS.yellow,
              absent: COLORS.gray
            };

            ctx.fillStyle = fillMap[status];
            ctx.fill();
          }
        }
      }


      return new Promise(resolve => {
        resultCanvas.toBlob(resolve, "image/png", 1);
      });
    }

    async function sharePNG() {
      const note = document.getElementById("shareNote");
      note.textContent = "";

      const blob = await createResultPNG();

      if (!blob) {
        note.textContent = "Could not create PNG.";
        return;
      }

      const file = new File(
        [blob],
        "xobdle-result.png",
        { type: "image/png" }
      );

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        try {
          await navigator.share({
            files: [file]
          });

          return;
        } catch (error) {
          if (error && error.name === "AbortError") {
            return;
          }
        }
      }

      downloadPNG(blob);
      note.textContent = "Direct image sharing is unavailable here, so the PNG was saved.";
    }

    async function savePNG() {
      const note = document.getElementById("shareNote");
      note.textContent = "";

      const blob = await createResultPNG();

      if (!blob) {
        note.textContent = "Could not create PNG.";
        return;
      }

      downloadPNG(blob);
      note.textContent = "PNG saved.";
    }

    function downloadPNG(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "xobdle-result.png";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function getViewportSize() {
      const viewport = window.visualViewport;

      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
      };
    }

    function getActivePage() {
      return document.getElementById("gamePage").classList.contains("hidden")
        ? document.getElementById("resultPage")
        : document.getElementById("gamePage");
    }

    function fitActivePage() {
      const page = getActivePage();

      if (!page) return;

      page.style.transform = "scale(1)";

      const viewport = getViewportSize();

      const naturalWidth = 460;
      const naturalHeight = page.scrollHeight;

      const widthScale = (viewport.width - 8) / naturalWidth;
      const heightScale = (viewport.height - 8) / naturalHeight;

      const scale = Math.min(
        1,
        widthScale,
        heightScale
      );

      page.style.transform = "scale(" + scale + ")";
    }

    function refitSoon() {
      requestAnimationFrame(() => {
        requestAnimationFrame(fitActivePage);
      });
    }

    document.getElementById("gameDate").textContent = formattedDate();

    document.getElementById("shareBtn").addEventListener("click", sharePNG);
    document.getElementById("saveBtn").addEventListener("click", savePNG);

    document.getElementById("backBtn").addEventListener("click", () => {
      document.getElementById("resultPage").classList.add("hidden");
      document.getElementById("gamePage").classList.remove("hidden");
      refitSoon();
    });

    buildBoard();
    buildKeyboard();
    renderBoard();
    updateVisitorCount();

    if (!localStorage.getItem("xobdleInstructionsSeen")) {
      openInstructions();
    }
    refitSoon();

    window.addEventListener("load", refitSoon);
    window.addEventListener("resize", refitSoon);
    window.addEventListener("orientationchange", refitSoon);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refitSoon);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(refitSoon);
    }
  </script>
</body>
</html>
