<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saurabh Kumar Nath</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    background: #fff;
    color: #111;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }


  .hero {
    min-height: 100vh;
    width: min(1120px, 92vw);
    margin: 0 auto;
    display: grid;
    place-items: center;
    padding: 86px 0 56px;
    text-align: center;
  }

  .content {
    width: 100%;
  }

  .wave-wrap {
    width: 100%;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .wave {
    width: 100%;
    height: auto;
    display: block;
  }

  .bar {
    stroke: #111;
    stroke-width: 1.35;
    stroke-linecap: round;
  }

  .wave-reveal {
    clip-path: inset(0 100% 0 0);
    animation: revealWave 3s linear forwards;
  }

  @keyframes revealWave {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  .identity {
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 1.15s ease forwards;
    animation-delay: 3.15s;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.9rem, 7vw, 6.8rem);
    font-weight: 620;
    letter-spacing: -.055em;
    line-height: .95;
  }

  .role {
    margin-top: 18px;
    font-size: clamp(.95rem, 2vw, 1.16rem);
    line-height: 1.55;
    opacity: .58;
  }

  .enter {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 30px;
    border: 1px solid #111;
    border-radius: 999px;
    color: #111;
    background: transparent;
    font: inherit;
    font-size: 1.12rem;
    text-decoration: none;
    cursor: pointer;

    opacity: 0;
    transform: translateY(6px);
    animation: helloAppear 1s ease 3.2s forwards;
  }

  .enter:hover,
  .enter:focus-visible,
  .enter:active {
    background: #e87532;
    border-color: #e87532;
    color: #fff;
  }

  /* Keep the orange visible briefly during a tap on touch screens. */
  .enter.tapped {
    background: #e87532;
    border-color: #e87532;
    color: #fff;
  }

  @keyframes helloAppear {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* After appearing, Hello makes a gentle periodic hop. */
  .enter.ready {
    animation: helloHop 1.8s ease-in-out infinite;
  }

  @keyframes helloHop {
    0%, 72%, 100% { transform: translateY(0); }
    80% { transform: translateY(-6px); }
    88% { transform: translateY(0); }
    94% { transform: translateY(-3px); }
  }

  @media (max-width: 600px) {
    .topbar {
      padding: 16px 16px;
      font-size: .64rem;
    }

    .hero {
      width: 100%;
      padding: 82px 18px 42px;
    }

    .wave-wrap {
      width: 100%;
      overflow: visible;
      margin-bottom: 22px;
    }

    .wave {
      width: 100%;
      max-width: 100%;
      transform: none;
    }

    .bar {
      stroke-width: 1.55;
    }

    h1 {
      font-size: clamp(3rem, 15vw, 4.8rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave-reveal {
      animation: none;
      clip-path: inset(0);
    }

    .enter {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
